[project]
name = "docuchat-evidence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pinecone>=10.0.0",
    "pydantic>=2.14.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
